{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
{% if errors %}<ul class="errors">{% for m in errors.values() %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
<form method="post" action="/register" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label>Логин <input type="text" name="login" value="{{ values.login }}" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" title="Латинские буквы, цифры и знак _"></label>
  <label>Почта <input type="email" name="email" value="{{ values.email }}" required maxlength="120"></label>
  <label>Телефон <input type="tel" name="phone" value="{{ values.phone }}" required placeholder="+7 916 123-45-67"></label>
  <label>Пароль <input type="password" name="password" required minlength="8"></label>
  <label>Повторите пароль <input type="password" name="password2" required minlength="8"></label>
  <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
